##spring.application.name=help-desk-backend



spring:
  application:
    name: help-desk-backend

  datasource:
    url: jdbc:mysql://localhost:3306/spring_ai_helpdesk?useSSL=false&serverTimezone=UTC
    username: root
    password: root1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b

server:
  port: 8081

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG








