#spring.application.name=help-desk-backend


spring:
  application:
    name: "help-desk-backend"
#    datasource configuration
  datasource:
    url: jdbc:mysql://localhost:3306/spring_ai_yt?useSSL=false&serverTimeZone=UTC
    username: root
    password: root1234

#    hibernate configuration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

server:
  port: 8081


#  database configuration

